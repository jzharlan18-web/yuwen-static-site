<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-ZNPiEZPtkkwyAW1lTI0T4B978D3MRvAfWR4PdrjaEPE='; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"><title>教师提问卡</title>
<style>
:root{color-scheme:light;font:16px/1.58 system-ui,sans-serif;background:#edf4ef;color:#172d26}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:20px 16px 48px}.top,.card{background:white;border:1px solid #d1e1d8;border-radius:15px;padding:16px;margin-bottom:14px}h1,h2,h3,p{margin:0 0 8px}h1{font-size:1.65rem}h2{font-size:1.35rem}h3{font-size:1rem;color:#20624b}button,select{font:inherit;color:inherit;background:white;border:1px solid #7e9c8e;border-radius:8px;padding:9px;min-height:44px}button{background:#205d49;color:white;cursor:pointer}select{min-width:0;max-width:100%;flex:1}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.muted{color:#4a6459}section{padding:12px 0;border-top:1px solid #d1e1d8;overflow-wrap:anywhere}summary{font-weight:650;color:#205d49;cursor:pointer;min-height:38px;padding:5px 0}li+li{margin-top:4px}[hidden]{display:none!important}@page{size:A4 portrait;margin:14mm}@media print{body{background:#fff;color:#000;font-size:10.5pt}main{max-width:none;padding:0}.top{display:none}.card{padding:0;border:0}section{break-inside:avoid-page;padding:7px 0}.muted,h3,summary{color:#000}}
</style></head><body><main><header class="top"><h1>教师提问卡</h1><p class="muted" id="status" role="status">正在检查专用链接…</p><div class="row" id="controls" hidden><label for="archive">批次</label><select id="archive"></select><button type="button" id="print">打印当前卡</button></div></header><article class="card" id="card" hidden></article></main>
<script>
'use strict';
const get=id=>document.getElementById(id), card=get('card'), archive=get('archive');
const context=new TextEncoder().encode('teacher-question-cards:v1');
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};
const from64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
let cards=[],printing=null;
function render(){const c=cards[Number(archive.value)];if(!c)return;card.replaceChildren(el('h2',c.title),el('p',`${c.class_label} · 批次 ${c.lesson_date} · 仅供教师使用`));for(const q of c.questions){const s=el('section');s.append(el('h3',`第 ${q.screen} 屏`),el('p',q.prompt));if(q.note){const n=el('p',q.note);n.className='muted';s.append(n);}if(q.candidates.length){const d=el('details'), l=el('ul');d.append(el('summary',`看候选人（${q.candidates.length}）`));for(const a of q.candidates){const i=el('li');i.append(el('strong',a.name),document.createTextNode('：'+a.reason));l.append(i);}d.append(l);s.append(d);}card.append(s);}card.hidden=false;}
function beforePrint(){if(card.hidden||printing)return;printing=[...card.querySelectorAll('details')].map(d=>[d,d.open]);for(const [d] of printing)d.open=true;}
function afterPrint(){if(!printing)return;for(const [d,was] of printing)d.open=was;printing=null;}
archive.addEventListener('change',render);window.addEventListener('beforeprint',beforePrint);window.addEventListener('afterprint',afterPrint);get('print').addEventListener('click',()=>{beforePrint();try{window.print();}catch{afterPrint();}});
async function start(){const k=location.hash.slice(1);if(!/^[A-Za-z0-9_-]{43}$/.test(k)){get('status').textContent='请打开您收藏的完整专用链接。这里不会显示题卡。';return;}if(!globalThis.crypto?.subtle){get('status').textContent='请使用支持安全连接的浏览器打开 HTTPS 专用链接。';return;}
let pack;try{const r=await fetch('cards.enc.json',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error();pack=await r.json();}catch{get('status').textContent='题卡暂时无法加载，请检查网络后刷新。';return;}
try{if(pack.v!==1)throw Error();const nonce=from64(pack.iv);if(nonce.length!==12)throw Error();const key=await crypto.subtle.importKey('raw',from64(k),'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce,additionalData:context},key,from64(pack.data));const value=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(plain));if(!Array.isArray(value)||!value.length)throw Error();cards=value;archive.replaceChildren(...cards.map((c,i)=>{const o=el('option',`${c.lesson_date} · ${c.class_label} · ${c.title}`);o.value=String(i);return o;}));render();get('status').textContent='请只在自己的屏幕上查看，不转发完整链接。';get('controls').hidden=false;}catch{cards=[];card.replaceChildren();card.hidden=true;get('controls').hidden=true;get('status').textContent='无法解锁题卡：请检查完整链接是否正确。';}}
window.addEventListener('hashchange',()=>location.reload());void start();
</script></body></html>
