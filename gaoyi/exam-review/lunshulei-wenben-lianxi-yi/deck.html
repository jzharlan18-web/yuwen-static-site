<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>高一语文检测一 · 现代文阅读（第1—5题）课堂讲评</title>
<!--
  设计说明（给后来改版的自己看）
  · 定位：课堂投屏用的讲评走台。16:9 固定 1280×720 舞台，JS 等比缩放居中，笔记本/投影/大屏都不变形。
  · 底线：单文件、零外链、零 CDN。教室断网、U 盘拷走、双击即开，都必须能跑。
  · 视觉坐标：讲义的骨相 + 一点书卷气。宣纸底、墨色字、宋体做标题、朱红只用于「错误与风险」，
    黛青只用于「文本证据」，赭石只用于「方法与模型」。全篇无渐变、无 emoji、无圆角卡片。
  · 记号：题号做成朱红印章，是这一版唯一的「用力处」，其余全部收敛。
  · 新增内容请同步更新 DECK 数据区，不要另起一套样式。
-->
<style>
:root{
  --paper:#F7F3EC;
  --paper2:#FDFBF6;
  --ink:#1E1B17;
  --ink2:#5B534A;
  --ink3:#928779;
  --rule:#E4DAC8;
  --rule2:#CFC3AE;
  --zhu:#B1382B;          /* 错误 · 风险 · 结论 */
  --zhu-soft:rgba(177,56,43,.10);
  --dai:#2E5F63;          /* 文本证据 */
  --dai-soft:rgba(46,95,99,.10);
  --zhe:#9A6B2C;          /* 方法 · 模型 */
  --zhe-soft:rgba(154,107,44,.10);
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#EDE7DC}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

#stage{
  position:absolute;left:50%;top:50%;
  width:1280px;height:720px;
  transform-origin:center center;
  background:var(--paper);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 24px 70px rgba(52,42,30,.20);
}

/* ── 卷首 ───────────────────────────── */
header{
  height:58px;flex:0 0 58px;display:flex;align-items:center;
  padding:0 30px 0 26px;border-bottom:1px solid var(--rule2);
  gap:16px;
}
.vol{display:flex;align-items:baseline;gap:10px;min-width:0}
.vol .mark{font-family:var(--serif);font-size:15px;color:var(--zhu);letter-spacing:.32em;writing-mode:vertical-rl;line-height:1;padding-top:2px;height:34px}
.vol h1{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.vol .src{font-size:12.5px;color:var(--ink3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:8px}
.tab{
  font-family:var(--serif);font-size:14px;letter-spacing:.08em;
  border:1px solid var(--rule2);background:transparent;color:var(--ink2);
  padding:5px 12px;cursor:pointer;transition:.18s;border-radius:1px;
}
.tab:hover{border-color:var(--ink3);color:var(--ink)}
.tab.on{background:var(--zhu);border-color:var(--zhu);color:#fff;font-weight:600}
.tab .stamp{font-size:11px;opacity:.7;margin-left:5px}

/* ── 主体 ───────────────────────────── */
.body{flex:1;display:flex;min-height:0}

/* 左侧六步导览 */
.rail{
  flex:0 0 182px;border-right:1px solid var(--rule2);
  padding:20px 0 12px;overflow-y:auto;
}
.rail .rl-lab{font-size:11px;letter-spacing:.26em;color:var(--ink3);padding:0 0 12px 22px}
.rail button{
  display:flex;align-items:baseline;gap:11px;width:100%;
  background:none;border:0;cursor:pointer;text-align:left;
  padding:8px 22px;font-family:var(--sans);font-size:15px;color:var(--ink2);
  transition:.16s;position:relative;
}
.rail button .num{font-family:var(--serif);font-size:15px;color:var(--ink3);width:16px;flex:0 0 16px;transition:.16s}
.rail button:hover{color:var(--ink);background:rgba(30,27,23,.03)}
.rail button.on{color:var(--zhu);font-weight:600}
.rail button.on .num{color:var(--zhu)}
.rail button.on::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:16px;background:var(--zhu);
}
.rail button.seen .num::after{content:"";display:block;width:4px;height:4px;background:var(--rule2);margin:3px auto 0;border-radius:50%}
.rail .rl-foot{margin-top:16px;padding:12px 22px 0;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink3);line-height:1.9}
.rail .rl-foot b{color:var(--ink2);font-weight:600}

/* 主内容区 */
.main{flex:1;min-width:0;overflow-y:auto;padding:24px 40px 20px 34px;position:relative}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:3px}
.screen{opacity:0;animation:rise .34s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.screen>h2{
  font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:.03em;
  line-height:1.28;margin-bottom:4px;
}
.screen .lede{font-size:14px;color:var(--ink3);letter-spacing:.05em;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.hairline{height:1px;background:var(--rule);margin:16px 0}

/* 讲义式「边栏标签 + 内容」 */
.row{display:flex;gap:14px;margin:13px 0;align-items:flex-start}
.row>.lab{
  flex:0 0 78px;font-size:12.5px;letter-spacing:.14em;color:var(--zhu);
  padding-top:5px;text-align:right;line-height:1.5;
}
.row>.lab.dai{color:var(--dai)}
.row>.lab.zhe{color:var(--zhe)}
.row>.lab.ink{color:var(--ink3)}
.row>.val{flex:1;min-width:0;font-size:17px;line-height:1.78}
.row>.val.sm{font-size:15.5px;line-height:1.72}
.main p{font-size:17px;line-height:1.78;margin:10px 0}
.main p.sm{font-size:15.5px;color:var(--ink2)}
b,strong{font-weight:600}
.hl{color:var(--zhu);font-weight:600;background:linear-gradient(transparent 62%,var(--zhu-soft) 62%)}
.ev{color:var(--dai);font-weight:600;background:linear-gradient(transparent 62%,var(--dai-soft) 62%)}
.md{color:var(--zhe);font-weight:600}
.quote{
  font-family:var(--serif);font-size:16.5px;line-height:1.85;color:var(--ink);
  padding:2px 0 2px 14px;border-left:2px solid var(--rule2);
}
.quote.zhu{border-left-color:var(--zhu);color:var(--zhu);font-weight:600}
.quote.dai{border-left-color:var(--dai)}

ul.dot{list-style:none}
ul.dot li{position:relative;padding-left:17px;margin:7px 0;font-size:17px;line-height:1.75}
ul.dot li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;background:var(--rule2);border-radius:50%}
ul.dot li.zhu::before{background:var(--zhu)}
ul.dot li.dai::before{background:var(--dai)}
ul.dot li.zhe::before{background:var(--zhe)}

ol.num{list-style:none;counter-reset:n}
ol.num li{counter-increment:n;position:relative;padding-left:30px;margin:10px 0;font-size:17px;line-height:1.75}
ol.num li::before{
  content:counter(n);position:absolute;left:0;top:.1em;
  font-family:var(--serif);font-size:15px;color:var(--zhe);
  width:20px;height:20px;line-height:20px;text-align:center;
  border:1px solid var(--zhe);border-radius:50%;opacity:.85;
}

/* 题干与选项 */
.prompt{font-family:var(--serif);font-size:19px;line-height:1.7;margin-bottom:12px}
.opts{list-style:none}
.opts li{display:flex;gap:11px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:16.5px;line-height:1.72}
.opts li:last-child{border-bottom:0}
.opts .k{font-family:var(--serif);font-size:16px;color:var(--ink3);flex:0 0 16px;padding-top:1px}
.opts li.bad .k{color:var(--zhu);font-weight:700}
.opts li.bad{color:var(--zhu)}

/* 表格 */
table{width:100%;border-collapse:collapse}
th{
  font-size:12.5px;letter-spacing:.1em;color:var(--ink3);font-weight:500;
  text-align:left;padding:0 12px 7px 0;border-bottom:1px solid var(--rule2);
}
td{font-size:15.5px;line-height:1.7;padding:9px 12px 9px 0;border-bottom:1px dashed var(--rule);vertical-align:top;color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
td.k{font-family:var(--serif);font-size:15px;color:var(--ink3);width:44px}
tr.mark-row td{background:var(--zhu-soft)}
tr.mark-row td.k{color:var(--zhu);font-weight:700}
td .tag{
  display:inline-block;font-size:12px;letter-spacing:.08em;
  border:1px solid currentColor;padding:1px 6px;border-radius:1px;
}
.tag.no{color:var(--zhu)}
.tag.yes{color:var(--dai)}

/* 双栏 */
.cols{display:flex;gap:30px;align-items:flex-start}
.cols>*{min-width:0}
.cols.c62>.c-l{flex:1 1 62%}
.cols.c62>.c-r{flex:0 0 34%}
.panel-box{
  background:var(--paper2);border:1px solid var(--rule);padding:16px 18px;border-radius:1px;
}
.panel-box .pb-lab{
  font-size:11.5px;letter-spacing:.2em;color:var(--ink3);
  padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--rule);
}
.panel-box p{font-size:14.5px;line-height:1.72;margin:7px 0}
.panel-box .kv{display:flex;gap:10px;font-size:14px;line-height:1.7;margin:6px 0}
.panel-box .kv span:first-child{color:var(--ink3);flex:0 0 52px}

/* 印章结论 */
.seal{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:74px;height:74px;background:var(--zhu);color:#fff;border-radius:2px;
  font-family:var(--serif);line-height:1.1;transform:rotate(-2.5deg);
  box-shadow:0 3px 10px rgba(177,56,43,.24);
}
.seal em{font-style:normal;font-size:10.5px;letter-spacing:.2em;opacity:.86}
.seal b{font-size:29px;letter-spacing:.02em}

/* 模型卡 */
.model{border-left:2px solid var(--zhe);padding:2px 0 2px 16px;margin:12px 0}
.model .m-i{display:flex;gap:12px;margin:9px 0;font-size:16.5px;line-height:1.7}
.model .m-i i{font-family:var(--serif);font-style:normal;color:var(--zhe);flex:0 0 18px}

/* 可展开 */
.rv{display:none;margin-top:6px}
.rv.show{display:block;animation:rise .28s ease}
.rv-btn{
  background:none;border:1px dashed var(--rule2);color:var(--ink3);
  font-family:var(--sans);font-size:12px;letter-spacing:.12em;
  padding:3px 10px;cursor:pointer;border-radius:1px;transition:.16s;
}
.rv-btn:hover{border-color:var(--zhu);color:var(--zhu)}
.rv-btn.on{border-style:solid;border-color:var(--zhu);color:var(--zhu)}

/* 找错卡 */
.err{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--rule);align-items:flex-start}
.err:last-of-type{border-bottom:0}
.err .no{
  font-family:var(--serif);font-size:12.5px;color:var(--zhu);flex:0 0 62px;
  letter-spacing:.1em;padding-top:3px;
}
.err .ct{flex:1;min-width:0}
.err .said{font-size:16.5px;line-height:1.72;color:var(--ink)}

/* 迁移题 */
.vary{border:1px solid var(--rule2);padding:16px 18px;border-radius:1px;margin:12px 0}
.vary .v-q{font-family:var(--serif);font-size:16.5px;line-height:1.75;margin-bottom:11px}
.vary .v-o{display:flex;gap:10px;font-size:16px;line-height:1.72;margin:6px 0}
.vary .v-o span:first-child{font-family:var(--serif);color:var(--ink3);flex:0 0 18px}

/* ── 页脚 ───────────────────────────── */
footer{
  flex:0 0 42px;height:42px;display:flex;align-items:center;gap:18px;
  padding:0 26px;border-top:1px solid var(--rule2);background:rgba(255,255,255,.35);
}
.dots{display:flex;gap:5px;align-items:center}
.dots .dot{width:7px;height:7px;background:var(--rule2);border:0;padding:0;cursor:pointer;border-radius:50%;transition:.16s}
.dots .dot.on{background:var(--zhu);width:18px;border-radius:4px;transform:scale(1.02)}
.dots .dot:hover:not(.on){background:var(--ink3)}
.pos{font-family:var(--serif);font-size:13px;color:var(--ink2);letter-spacing:.06em}
.pos b{color:var(--zhu);font-weight:600}
.hint{margin-left:auto;font-size:11.5px;color:var(--ink3);letter-spacing:.06em;display:flex;gap:14px;align-items:center}
.hint kbd{
  font-family:var(--sans);font-size:10.5px;color:var(--ink2);
  border:1px solid var(--rule2);padding:1px 5px;border-radius:2px;margin-right:3px;
}
.tgl{
  background:none;border:1px solid var(--rule2);color:var(--ink2);
  font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;
  padding:3px 9px;cursor:pointer;border-radius:1px;transition:.16s;
}
.tgl:hover{border-color:var(--ink3);color:var(--ink)}
.tgl.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ── 教师面板 ───────────────────────── */
.tp{
  position:absolute;top:0;right:0;width:382px;height:100%;
  background:var(--paper2);border-left:1px solid var(--rule2);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;z-index:20;
  box-shadow:-14px 0 34px rgba(52,42,30,.10);
}
.tp.on{transform:none}
.tp-head{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--rule2);padding:0 16px;height:46px;flex:0 0 46px}
.tp-tab{
  background:none;border:0;font-family:var(--sans);font-size:13.5px;letter-spacing:.1em;
  color:var(--ink3);padding:6px 12px;cursor:pointer;border-bottom:2px solid transparent;transition:.16s;
}
.tp-tab.on{color:var(--zhu);border-bottom-color:var(--zhu);font-weight:600}
.tp-x{margin-left:auto;background:none;border:0;color:var(--ink3);font-size:17px;cursor:pointer;padding:4px 6px;line-height:1}
.tp-x:hover{color:var(--zhu)}
.tp-body{flex:1;overflow-y:auto;padding:16px 18px 24px}
.tp-body::-webkit-scrollbar{width:5px}
.tp-body::-webkit-scrollbar-thumb{background:var(--rule2)}
.tp-sec{margin-bottom:18px}
.tp-sec .t{font-size:11.5px;letter-spacing:.2em;color:var(--ink3);padding-bottom:7px;margin-bottom:9px;border-bottom:1px solid var(--rule)}
.tp-line{font-size:14px;line-height:1.8;margin:8px 0;color:var(--ink)}
.tp-line b{color:var(--zhu);font-weight:600}
.tp-line.dai b{color:var(--dai)}
.tp-mini{width:100%;border-collapse:collapse}
.tp-mini td{font-size:13px;padding:5px 8px 5px 0;border-bottom:1px dotted var(--rule);color:var(--ink2);line-height:1.6}
.tp-mini td:first-child{color:var(--ink);width:52px;font-weight:600}
.tp-mini td:nth-child(2){width:44px;color:var(--zhu)}
.tp-note{font-size:12.5px;color:var(--ink3);line-height:1.75;border-top:1px solid var(--rule);padding-top:10px}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="vol">
      <div class="mark">语文</div>
      <h1>高一语文检测一 · 现代文阅读讲评</h1>
      <span class="src">文本：《习近平总书记这样谈中华文明的包容性》（《瞭望》2024年第12期）</span>
    </div>
    <div class="head-right">
      <div class="tabs" id="tabs"></div>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail">
      <div class="rl-lab">讲评路径</div>
      <div id="railItems"></div>
      <div class="rl-foot">
        <div><b>六步法</b></div>
        <div>定性 → 找错 → 回文</div>
        <div>→ 拆干 → 建模 → 迁移</div>
      </div>
    </nav>
    <main class="main" id="main"></main>
  </div>

  <footer>
    <div class="dots" id="dots"></div>
    <div class="pos" id="pos"></div>
    <div class="hint">
      <span><kbd>←</kbd><kbd>→</kbd>翻页</span>
      <span><kbd>空格</kbd>显示</span>
      <span><kbd>1</kbd>–<kbd>5</kbd>切题</span>
      <button class="tgl" id="tScript">教师话术 T</button>
      <button class="tgl" id="tFull">全屏 F</button>
    </div>
  </footer>

  <aside class="tp" id="tp">
    <div class="tp-head">
      <button class="tp-tab on" data-ptab="script">课堂话术</button>
      <button class="tp-tab" data-ptab="prep">备课预判</button>
      <button class="tp-x" id="tpClose">×</button>
    </div>
    <div class="tp-body" id="tpBody"></div>
  </aside>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   数据区：五题内容。改题、增题只动这里。
   ══════════════════════════════════════════════════════════════ */
const RAIL = ['题面','定性','找错','回文','拆干','建模','迁移'];
const RAIL_NUM = ['卷','一','二','三','四','五','六'];

const DECK = [
/* ───────────────── 第 1 题 ───────────────── */
{
  n:'第1题', type:'内容理解选择题', ans:'C', kind:'选择',
  board:[
    ['题型本质','内容理解 + 逻辑限定'],
    ['错误路径','找到同词 = 判定正确'],
    ['文本依据','前提 · 根本途径 · 求同存异'],
    ['核心差异','必要条件 ≠ 充分条件'],
    ['解题模型','主体 — 范围 — 程度 — 关系'],
    ['结论','C']
  ],
  time:[['定性','1′','追问题目任务'],['找错','2′','呈现两种错因'],['回文','3′','组织四比对表'],['拆干','1′','强调四比对'],['建模','2′','总结四比对法'],['迁移','2′','给出“阅读积累”句']],
  script:[
    ['开场','“这道题的四个选项，说的话都在原文里找得到影子。命题人没有编造内容，他动的是关系。”'],
    ['关键追问','“‘前提’能推出‘就一定能’吗？把这两个词摆在一起读一遍。”'],
    ['纠错瞬间','“你找到了正确的句子，却放过了错误的连接词。”'],
    ['模型生成','“比主体、比范围、比程度、比关系——四个比对做完，再下结论。”'],
    ['收束','“找得到原句只是第一步，比得出差别才是得分点。”']
  ],
  prep:[
    ['真正考什么','判断选项对原文逻辑关系的改写，而不是能否找到原句。'],
    ['错误路径一','只找原句比对词语，看到“平等是‘容’的前提”便判 C 正确，忽略后半句“就一定能”。'],
    ['错误路径二','认为 A、D 谈宏大意义属“拔高”而误选。'],
    ['文本依托','“平等是‘容’的前提……正是因为在民族平等尊重基础上实现了民族团结互助，融合发展。”'],
    ['关键限制词','“不正确”“相关内容的理解和分析”。'],
    ['思维模型','条件关系检验：前提 ≠ 充分条件。'],
    ['可否迁移','可迁移到所有信息类、论述类文本的选择判断题。']
  ],

  face:`
    <div class="cols c62">
      <div class="c-l">
        <p class="prompt">1．下列对原文相关内容的理解和分析，不正确的一项是（　）</p>
        <ul class="opts">
          <li><span class="k">A</span><span class="t">中华文明包容的胸怀与智慧，为当今世界正确处理差异、化解冲突、实现融合，使各方和谐相处、共同发展，提供了中国方案。</span></li>
          <li><span class="k">B</span><span class="t">“包容”的胸怀不仅包括吸收佛教思想等外来文化，也包括像丝绸之路这样，推动中华文明走向世界，是个双向的交往与交流。</span></li>

  /* 五 建模 */
  `

          <div class="m-i"><i>④</i><div><b>比关系</b>：并列、因果、条件、递进是否被替换？</div></div>
        </div>

        <div class="row"><div class="lab">条件关系<br>补充分辨</div><div class="val">

            <thead><tr><th style="width:130px">关系</th><th>含义</th><th style="width:200px">表述标志</th></tr></thead>

              <tr><td>必要条件</td><td>没有它不行</td><td>前提、基础、重要条件</td></tr>
              <tr><td>充分条件</td><td>有它就一定行</td><td>只要……就、一定能、必然</td></tr>
            </tbody>
          </table>
          <p class="sm" style="margin-top:10px">选项把原文的“前提”（必要条件）改写成“就一定能”（充分条件），属于<span class="hl">逻辑强度的越界</span>。</p>

      </div>

      </div>

/* ══════════════════════════════════════════════════════════════
   渲染与交互
   ══════════════════════════════════════════════════════════════ */
const STEP_LABEL = ['题面','定性','找错','回文','拆干','建模','迁移'];
const STEP_SUB   = ['题干与素养定位','先说清这题在考什么','让错误路径显形','把结论钉回文本','把要求改写成动作','从一题到一类','当场用模型验一遍'];
const STORE_KEY = 'yuwen-pingjiang-1-3';

const el = {
  stage:document.getElementById('stage'),
  tabs:document.getElementById('tabs'),
  rail:document.getElementById('railItems'),
  main:document.getElementById('main'),
  dots:document.getElementById('dots'),
  pos:document.getElementById('pos'),
  tp:document.getElementById('tp'),
  tpBody:document.getElementById('tpBody'),
  tScript:document.getElementById('tScript'),
  tFull:document.getElementById('tFull')
};

let cur = {q:0, s:0, panel:false, ptab:'script'};
const seen = {};   // 记录已看过的屏，rail 上打小点

/* ── 缩放 ── */
function fit(){
  const s = Math.min(window.innerWidth/1280, window.innerHeight/720);
  el.stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);

/* ── 顶栏 tabs ── */
function drawTabs(){
  el.tabs.innerHTML = DECK.map((q,i)=>
    `<button class="tab ${i===cur.q?'on':''}" data-q="${i}">${q.n}<span class="stamp">${q.ans}</span></button>`
  ).join('');
}

/* ── 左栏 ── */
function drawRail(){
  el.rail.innerHTML = STEP_LABEL.map((lb,i)=>
    `<button class="${i===cur.s?'on':''} ${seen[cur.q+'-'+i]?'seen':''}" data-s="${i}">
       <span class="num">${RAIL_NUM[i]}</span><span>${lb}</span>
     </button>`
  ).join('');
}

/* ── 底部圆点 ── */
function drawDots(){
  el.dots.innerHTML = STEP_LABEL.map((_,i)=>
    `<button class="dot ${i===cur.s?'on':''}" data-s="${i}" title="${STEP_LABEL[i]}"></button>`
  ).join('');
  el.pos.innerHTML = `${DECK[cur.q].n} · <b>${STEP_LABEL[cur.s]}</b>　${cur.s+1}/${STEP_LABEL.length}`;
}

/* ── 主内容 ── */
function drawMain(){
  const q = DECK[cur.q];
  const html = cur.s===0 ? q.face : q.steps[cur.s-1];
  el.main.innerHTML = `<section class="screen">${html}</section>`;
  el.main.scrollTop = 0;
  bindReveal();
  seen[cur.q+'-'+cur.s] = true;
}

/* ── 可展开块 ── */
function bindReveal(){
  el.main.querySelectorAll('[data-rv]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wrap = btn.closest('.rv-btn-wrap');
      const box = wrap.querySelector('.rv');
      const on = box.classList.toggle('show');
      btn.classList.toggle('on', on);
      btn.textContent = on ? '收起' : btn.dataset.label;
    });
    if(!btn.dataset.label) btn.dataset.label = btn.textContent;
  });
}

/* 空格：一键显示 / 收起当前屏所有折叠内容 */
function toggleAll(){
  const btns = [...el.main.querySelectorAll('[data-rv]')];
  if(!btns.length) return;
  const anyClosed = btns.some(b=>!b.closest('.rv-btn-wrap').querySelector('.rv').classList.contains('show'));
  btns.forEach(b=>{
    const box = b.closest('.rv-btn-wrap').querySelector('.rv');
    box.classList.toggle('show', anyClosed);
    b.classList.toggle('on', anyClosed);
    b.textContent = anyClosed ? '收起' : b.dataset.label;
  });
}

/* ── 教师面板 ── */
function drawPanel(){
  const q = DECK[cur.q];
  let h = '';
  if(cur.ptab==='script'){
    h += `<div class="tp-sec"><div class="t">课堂话术 · 可直接照读</div>`;
    q.script.forEach(([k,v],i)=>{
      h += `<div class="tp-line ${i===1?'dai':''}"><b>${k}</b>　${v}</div>`;
    });
    h += `</div>`;
    h += `<div class="tp-sec"><div class="t">本题本质</div><div class="tp-line">见「题面」屏素养定位卡。</div></div>`;
  }else{
    h += `<div class="tp-sec"><div class="t">课前预判</div>`;
    q.prep.forEach(([k,v])=>{
      h += `<div class="tp-line"><b>${k}</b><br>${v}</div>`;
    });
    h += `</div>`;
    h += `<div class="tp-sec"><div class="t">时间与活动设计</div>
      <table class="tp-mini"><tbody>`;
    q.time.forEach(([a,b,c])=>{ h += `<tr><td>${a}</td><td>${b}</td><td>${c}</td></tr>`; });
    h += `</tbody></table></div>`;
    h += `<div class="tp-sec"><div class="t">板书设计</div>`;
    q.board.forEach(([k,v])=>{ h += `<div class="tp-line"><b>${k}</b>　${v}</div>`; });
    h += `</div>`;
    h += `<div class="tp-note">本卷未提供班级错误率与典型答卷，以上错因均为高概率预判，课堂上应以学生口述或答题数据校正后再定讲评重点。</div>`;
  }
  el.tpBody.innerHTML = h;
}

function setPanel(on){
  cur.panel = on;
  el.tp.classList.toggle('on', on);
  el.tScript.classList.toggle('on', on);
  if(on) drawPanel();
}

/* ── 统一刷新 ── */
function render(){
  drawTabs(); drawRail(); drawDots(); drawMain();
  if(cur.panel) drawPanel();
  save();
}
function go(q,s){
  cur.q = Math.max(0, Math.min(DECK.length-1, q));
  cur.s = Math.max(0, Math.min(STEP_LABEL.length-1, s));
  render(); hash();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({q:cur.q,s:cur.s})); }catch(e){}
}
function hash(){
  if(location.hash !== '#q'+cur.q+'s'+cur.s) history.replaceState(null,'','#q'+cur.q+'s'+cur.s);
}

/* ── 事件 ── */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-q],[data-s],[data-ptab]');
  if(!t) return;
  if(t.dataset.q!==undefined){ go(+t.dataset.q, 0); }
  else if(t.dataset.s!==undefined){ go(cur.q, +t.dataset.s); }
  else if(t.dataset.ptab){ cur.ptab = t.dataset.ptab; drawPanel();
    document.querySelectorAll('.tp-tab').forEach(b=>b.classList.toggle('on', b.dataset.ptab===cur.ptab));
  }
});
document.getElementById('tpClose').addEventListener('click', ()=>setPanel(false));
el.tScript.addEventListener('click', ()=>setPanel(!cur.panel));
el.tFull.addEventListener('click', ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
});

document.addEventListener('keydown', e=>{
  const k = e.key;
  if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); cur.s<STEP_LABEL.length-1 ? go(cur.q,cur.s+1) : go(cur.q+1,0); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); cur.s>0 ? go(cur.q,cur.s-1) : go(cur.q-1,STEP_LABEL.length-1); }
  else if(k==='ArrowDown'){ e.preventDefault(); go(cur.q+1,cur.s); }
  else if(k==='ArrowUp'){ e.preventDefault(); go(cur.q-1,cur.s); }
  else if(k===' '||k==='Enter'){ e.preventDefault(); toggleAll(); }
  else if(/^[1-9]$/.test(k)){ go(+k-1,0); }
  else if(k==='0'){ go(cur.q,0); }
  else if(k.toLowerCase()==='t'){ setPanel(!cur.panel); }
  else if(k.toLowerCase()==='f'){ el.tFull.click(); }
  else if(k==='Home'){ go(0,0); }
  else if(k==='End'){ go(DECK.length-1,STEP_LABEL.length-1); }
  else if(k==='Escape'){ setPanel(false); }
});

/* ── 启动：先读 hash，再读上次位置 ── */
(function init(){
  fit();
  const m = location.hash.match(/^#q(\d)s(\d)/);
  if(m){ cur.q=+m[1]; cur.s=+m[2]; }
  else{
    try{
      const old = JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
      if(typeof old.q==='number'){ cur.q=old.q; cur.s=old.s||0; }
    }catch(e){}
  }
  document.querySelectorAll('.tp-tab').forEach(b=>b.classList.toggle('on', b.dataset.ptab===cur.ptab));
  render();
})();
</script>
</body>
</html>
