<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经历怎样支撑感受｜课堂草案</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f0;color:#27251f;font-family:PingFang SC,Microsoft YaHei,sans-serif}header{padding:18px 28px;background:white;border-bottom:1px solid #ded8cc}h1{font-size:25px;margin:0}small{color:#786f62}.mainq{margin:10px 0 0;font-size:21px;line-height:1.6;color:#8b3a2e;font-weight:600}.layout{display:grid;grid-template-columns:210px 1fr}nav{padding:18px;background:#efede6}button{font:inherit;background:white;border:1px solid #bbb3a5;border-radius:3px;padding:8px 12px;cursor:pointer;color:#263d4a}nav button{display:block;width:100%;text-align:left;margin-bottom:8px}button[aria-current=true]{border-color:#315d77;background:#e7eff1}main{padding:22px 36px;min-width:0}h2{font-size:23px;margin:0}.question{font-size:23px;line-height:1.5}summary{cursor:pointer;color:#315d77}.tip{padding:12px;background:#edf3f1;line-height:1.7}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.reader{font-size:var(--size,40px);line-height:1.75;background:white;border:1px solid #ddd8cc;padding:20px 30px;height:56vh;overflow:auto;overflow-wrap:anywhere}.reader p{margin:0 0 .8em}.id{font:14px sans-serif;color:#8b8377;user-select:none;margin-right:12px}.hl{background:#f6e29b}.ul{text-decoration:underline;text-decoration-color:#315d77}.pick{outline:2px dashed #a46b38;cursor:pointer}.status{color:#8b552f;min-height:1.5em}.note{font-size:19px;line-height:1.7}.disabled{background:#f8eee1;padding:20px}@media(max-width:800px){.layout{display:block}nav{display:flex;gap:5px;overflow:auto}nav button{min-width:135px}main{padding:18px}}</style><header><h1>经历怎样支撑感受</h1><small>《山地回忆》｜课堂阅读网页草案 · 待教师确认</small><p class="mainq">一句深切的感受，怎样由前面具体的经历托起来；经历中的哪一处细节，真正让这份感受可信。</p></header><div class="layout"><nav id="nav" aria-label="课堂环节"></nav><main id="main"></main></div><script>
'use strict';
const PARAGRAPHS=["那是个冬天，该是一九四一年的冬天，我打游击打到了这个小村庄，情况缓和了，部队决定休息两天。", "我每天到河边去洗脸，河里结了冰，我登在冰冻的石头上，把冰砸破，浸湿毛巾，等我擦完脸，毛巾也就冻挺了。有一天早晨，刮着冷风，只有一抹阳光，黄黄的落在河对面的山坡上。我又登在那块石头上去，砸开那个冰口，正要洗脸，听见在下水流有人喊：", "“你看不见我在这里洗菜吗？洗脸到下边洗去！”", "这声音是那么严厉，我听了很不高兴。这样冷天，我来砸冰洗脸，反倒妨碍了人。心里一时挂火，就也大声说：", "“离着这么远，会弄脏你的菜！”", "我站在上风头，狂风吹送着我的愤怒，我听见洗菜的人也恼了，那人说：“菜是下口的东西呀！你在上流洗脸洗屁股，为什么不脏？”", "“你怎么骂人？”我站立起来转过身去，才看见洗菜的是个女孩子，也不过十六七岁。风吹红了她的脸，像带霜的柿叶，水冻肿了她的手，像上冻的红萝卜。她穿的衣服很单薄，就是那种蓝色的破袄裤。", "十月严冬的河滩上，敌人往返烧毁过几次的村庄的边沿，在寒风里，她抱着一篮子水沤的杨树叶，这该是早饭的食粮。", "不知道为什么，我一时心平气和下来。我说：“我错了，我不洗了，你在这块石头上来洗吧！”", "她冷冷地望着我，过了一会才说：“你刚在那石头上洗了脸，又叫我站上去洗菜！”", "我笑着说：“你看你这人，我在上水洗，你说下水脏，这么一条大河，哪里就能把我脸上的泥土冲到你的菜上去？现在叫你到上水来，我到下水去，你还说不行，那怎么办哩？”", "“怎么办，我还得往上走！”", "她说着，扭着身子逆着河流往上去了。登在一块尖石上，把菜篮浸进水里，把两手插在袄襟底下取暖，望着我笑了。", "我哭不得，也笑不得，只好说：“你真讲卫生呀！”", "“我们是真卫生，你们是装卫生！你们尽笑话我们，说我们山沟里的人不讲卫生，住在我们家里，吃了我们的饭，还刷嘴刷牙，我们的菜饭再不干净，难道还会弄脏了你们的嘴？为什么不连肠子肚子都刷刷干净！”说着就笑得弯下腰去。", "我也觉得好笑。可也看见，在她笑着的时候，她的整齐的牙齿洁白得放光。", "“对，你卫生，我们不卫生。”我说。", "“那是假话吗？你们一个饭缸子，也盛饭，也盛菜，也洗脸，也洗脚，也喝水，也尿泡，那是讲卫生吗？”她笑着用两手在冷水里刨抓。", "“这是物质条件不好，不是我们愿意不卫生。等我们打败了日本，占了北平，我们就可以吃饭有吃饭的家伙，喝水有喝水的家伙了，我们就可以一切齐备了。”", "“什么时候，才能打败鬼子？”女孩子望着我，“我们的房，叫他们烧过两三回了！”", "“也许三年，也许五年，也许十年八年。可是不管三年五年，十年八年，我们总是要打下去，我们不会悲观的。”我这样对她讲，当时觉得这样讲了以后，心里很高兴了。", "“光着脚打下去吗？”女孩子转脸望了我脚上一下，就又低下头去洗菜了。", "我一时没弄清是怎么回事，就问：“你说什么？”", "“说什么？”女孩子也装没有听见，“我问你为什么不穿袜子，脚不冷吗？不会求人做一双？”", "“哪里有布呀？就是有布，求谁做去呀？”", "“我给你做。”女孩子洗好菜站起来，“我家就住在那个坡子上，”她用手一指，“你要没有布，我家里有点，还够做一双袜子。”", "她端着菜走了，我在河边上洗了脸。我看了看我那只穿着一双“踢倒山”的鞋子，冻得发黑的脚，一时觉得我对于面前这山，这水，这沙滩，永远不能分离了。", "第五天，我穿上了新袜子。", "女孩子的父亲是个生产的好手，现在地里没活了，他正计划贩红枣到曲阳去卖，问我能不能帮他的忙。部队重视民运工作，上级允许我帮老乡去作运输，每天打早起，我同大伯背上一百多斤红枣，顺着河滩，爬山越岭，送到曲阳去。女孩子早起晚睡给我们做饭，饭食很好，一天，大伯说：“同志，你知道我是沾你的光吗？”", "“怎么沾了我的光？”", "“往年，我一个人背枣，我们妞儿是不会给我吃这么好的！”", "我笑了。女孩子说：“沾他什么光，他穿了我们的袜子，就该给我们做活了！”", "又说：“你们跑了快半月，赚了多少钱？”", "我们一同数了票子，一共赚了五千多块钱，女孩子说：“够了。”", "“够干什么了？”大伯问。", "“够给我买张织布机子了！这一趟，你们在曲阳给我买架织布机子回来吧！”", "大家都没人反对女孩子这个正义的要求。我们到了曲阳，把枣卖了，就去买了一架机子。大伯不怕多花钱，一定要买一架好的，把全部盈余都用光了。我们分着背了回来，累得浑身流汗。", "这一天，这一家人最高兴，也该是女孩子最满意的一天。这像要了几亩地，买回一头牛；这像制好了结婚前的陪送。", "以后，女孩子就学习纺织的全套手艺了：纺，拐，浆，落，经，镶，织。", "当她卸下第一匹布的那天，我出发了。从此以后，我走遍山南塞北，那双袜子，整整穿了三年也没有破绽。一九四五年，我们战胜了日本强盗，我从延安回来，在碛口地方，跳到黄河里去洗了一个澡，一时大意，奔腾的黄水，冲走了我的全部衣物，也冲走了那双袜子。黄河的波浪激荡着我关于敌后几年生活的回忆，激荡着我对于那女孩子的纪念。", "开国典礼那天，我同大伯一同到百货公司去买布，送他和大娘一人一身蓝士林布，另外，送给女孩子一身红色的。大伯没见过这样鲜艳的红布，对我说：“多买上几尺，再买点黄色的。”", "“干什么用？”我问。", "“这里家家门口挂着新旗，咱那山沟里准还没有哩！你给了我一张国旗的样子，一块带回去，叫妞儿给做一个，开会过年的时候，挂起来！”", "他说妞儿已经有两个孩子了，还像小时那样，就是喜欢新鲜东西，说什么也要学会。"];
const RANGES={feeling:[26,26],reading:[1,26],whole:[0,43]};
const STAGES=[['A01','先找感受','读“我”的感受，你读出了怎样的感情？结合原句说说，可以有不同理解。','feeling'],['A02','再找依据','前面的哪些经历或细节让你觉得这份感受有来由？画出来，说说它们之间的联系。','reading'],['A03','回到自己的作文','选一处感受，找出最能支撑它的经历。读者能否看懂两者的联系？','feeling'],['A04','延伸阅读','继续阅读后文，看看哪些经历帮助你理解人与人之间的联系。','whole'],['C01','独立检测待备','','']];
const LOOK=[['回看感受','feeling'],['回看河边经历','reading'],['阅读全文','whole']];
const COMPOSED=['候选学习提醒｜待教师确认：先找经历，再解释它如何支撑感受。','操作问题：这段经历中哪处已有内容，让读者理解这份感受？','可观察判据：能指出感受、相关经历或细节，并说明二者的联系。'];
const KEY='mountain-memory-20261030-v1';let marks=[],size=40,stage=0,range=null,stack=[],pick=false;try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(x.marks))marks=x.marks.filter(m=>PARAGRAPHS[m.p]&&Number.isInteger(m.s)&&Number.isInteger(m.e)&&m.s>=0&&m.e>m.s&&m.e<=PARAGRAPHS[m.p].length&&['hl','ul'].includes(m.type));if(Number.isInteger(x.size))size=Math.max(32,Math.min(56,x.size))}catch(e){}const $=s=>document.querySelector(s), locked=()=>stage===4;function save(){try{localStorage.setItem(KEY,JSON.stringify({marks,size}))}catch(e){}}function status(t){const n=$('#status');if(n)n.textContent=t}function nav(i){if(locked()&&i!==stage&&!confirm('如已进行检测，请确认已完成并收齐；当前无检测材料，是否返回阅读？'))return;stage=i;range=null;stack=[];pick=false;render()}function look(k){if(locked())return;stack.push({range,scroll:$('#reader').scrollTop});range=k;pick=false;render()}function back(){if(locked()||!stack.length)return;let x=stack.pop();range=x.range;pick=false;render();$('#reader').scrollTop=x.scroll}
function text(){if(locked())return;let reader=$('#reader'),r=RANGES[range||STAGES[stage][3]];reader.textContent='';for(let p=r[0];p<=r[1];p++){let el=document.createElement('p');el.dataset.p=p;let label=document.createElement('span');label.className='id';label.textContent='P'+String(p+1).padStart(2,'0');el.appendChild(label);let pos=0;marks.filter(m=>m.p===p).sort((a,b)=>a.s-b.s).forEach(m=>{el.appendChild(document.createTextNode(PARAGRAPHS[p].slice(pos,m.s)));let span=document.createElement('span');span.className=m.type+(pick?' pick':'');span.textContent=PARAGRAPHS[p].slice(m.s,m.e);span.onclick=()=>{if(locked()||!pick)return;marks=marks.filter(x=>x!==m);pick=false;save();let y=reader.scrollTop;text();reader.scrollTop=y;status('已取消一笔标记。')};el.appendChild(span);pos=m.e});el.appendChild(document.createTextNode(PARAGRAPHS[p].slice(pos)));reader.appendChild(el)}}
function mark(type){if(locked())return;let sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount){status('请先在同一段正文内拖选文字。');return}let r=sel.getRangeAt(0),a=r.startContainer.parentElement?.closest('p[data-p]'),b=r.endContainer.parentElement?.closest('p[data-p]');if(!a||a!==b||!$('#reader').contains(a)||r.startContainer.parentElement.closest('.id')||r.endContainer.parentElement.closest('.id')){status('请在同一段正文内选取文字。');return}function offset(node,n){let w=document.createTreeWalker(a,NodeFilter.SHOW_TEXT),t,total=0;while((t=w.nextNode())){if(t.parentElement.closest('.id'))continue;if(t===node)return total+n;total+=t.length}return null}let s=offset(r.startContainer,r.startOffset),e=offset(r.endContainer,r.endOffset),p=Number(a.dataset.p);if(s===null||e===null||s>=e||marks.some(m=>m.p===p&&m.s<e&&m.e>s)){status('选区无效或与已有标记重叠。');return}marks.push({p,s,e,type});pick=false;sel.removeAllRanges();save();let y=$('#reader').scrollTop;text();$('#reader').scrollTop=y;status('已标记，原文未改动。')}
function render(){let n=$('#nav'),c=$('#main');n.textContent='';STAGES.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s[0]+' '+s[1];b.setAttribute('aria-current',String(stage===i));b.onclick=()=>nav(i);n.appendChild(b)});c.textContent='';let h=document.createElement('h2');h.textContent=STAGES[stage][0]+' · '+STAGES[stage][1];c.appendChild(h);if(locked()){let d=document.createElement('p');d.className='note disabled';d.textContent='尚未提供新检测材料，本页不生成检测题或答案。待教师提供材料并确认后再设计。正式检测应先收起纸面课文、旧作、活动单及附件，独立作答并收卷后再反馈。页面锁定只是课堂提示管理，不是防止提取本地源码的保密机制。';c.appendChild(d);return}let m=document.createElement('p');m.className='meta';m.textContent='正文依据教师提供文本，版本与授权待核证；P编号是网页定位，不是教材页码。';c.appendChild(m);let q=document.createElement('p');q.className='question';q.textContent=STAGES[stage][2];c.appendChild(q);if(stage===2){let t=document.createElement('p');t.className='note';t.textContent='在自己的文章上标出感受句和相应经历，写一句判断。已有内容清楚可保留；需要时调整已有内容、缩小感受范围，或只补本人确认的真实细节。';c.appendChild(t)}let d=document.createElement('details'),sum=document.createElement('summary');sum.textContent='讨论后由教师显示学习提醒（候选，待教师确认）';d.appendChild(sum);let tips=document.createElement('div');tips.className='tip';COMPOSED.forEach(s=>{let p=document.createElement('p');p.textContent=s;tips.appendChild(p)});d.appendChild(tips);c.appendChild(d);let tools=document.createElement('div');tools.className='tools';c.appendChild(tools);function button(t,f){let b=document.createElement('button');b.textContent=t;b.onclick=f;tools.appendChild(b);return b}LOOK.forEach(x=>button(x[0],()=>look(x[1])));if(stack.length)button('返回上一步',back);button('字号－',()=>{size=Math.max(32,size-2);document.documentElement.style.setProperty('--size',size+'px');save()});button('字号＋',()=>{size=Math.min(56,size+2);document.documentElement.style.setProperty('--size',size+'px');save()});[['高亮 H','hl'],['划线 U','ul']].forEach(([t,k])=>{let b=button(t,()=>mark(k));b.addEventListener('mousedown',e=>e.preventDefault())});button('撤销 Z',undo);button('取消单笔 X',cancel);let st=document.createElement('div');st.id='status';st.className='status';st.setAttribute('aria-live','polite');c.appendChild(st);let reader=document.createElement('article');reader.id='reader';reader.className='reader';reader.setAttribute('aria-label','原文阅读区');c.appendChild(reader);text()}
function undo(){if(locked())return;marks.pop();save();let y=$('#reader').scrollTop;text();$('#reader').scrollTop=y;status('已撤销最近一笔。')}function cancel(){if(locked())return;pick=!pick;let y=$('#reader').scrollTop;text();$('#reader').scrollTop=y;status(pick?'点击标记取消；Esc退出。':'已退出取消模式。')}document.documentElement.style.setProperty('--size',size+'px');document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key==='Escape'){if(pick)cancel();else if(stack.length)back();return}if(locked())return;let k=e.key.toLowerCase();if(k==='h'||k==='u'){e.preventDefault();mark(k==='h'?'hl':'ul')}else if(k==='z')undo();else if(k==='x')cancel()});render();
